name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake (x64)
        run: cmake -S . -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target AntihumanBitcrush_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: antihuman-bitcrush-windows-x64
          path: build/AntihumanBitcrush_artefacts/Release/VST3/ant!human Bitcrush.vst3
          if-no-files-found: error
